
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Grid Website Layout</title>
    <link rel="stylesheet" href="grid-layout.css">
</head>
<body>
    <div class="page-layout">
        <header class="header">
            <h1>My Website</h1>
        </header>

        <aside class="sidebar">
            <h2>Sidebar</h2>
            <ul>
                <li>Home</li>
                <li>About</li>
                <li>Services</li>
                <li>Contact</li>
            </ul>
        </aside>

        <main class="main-content">
            <h2>Main Content</h2>
            <p>This area contains the main information for the website.</p>
            <p>CSS Grid helps organise the page into rows and columns.</p>
        </main>

        <footer class="footer">
            <p>&copy; 2026 My Website</p>
        </footer>
    </div>
</body>
</html>
