
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Column Sizes</title>
    <link rel="stylesheet" href="grid-columns.css">
</head>
<body>
    <h1>CSS Grid Column Sizes</h1>

    <div class="grid-container">
        <div class="box">Sidebar (200px)</div>
        <div class="box">Main Content (1fr)</div>
        <div class="box">Extra Content (1fr)</div>
    </div>

    <h2>Two Unequal Columns</h2>

    <div class="two-columns">
        <div class="box">One Fraction</div>
        <div class="box">Two Fractions</div>
    </div>
</body>
</html>
