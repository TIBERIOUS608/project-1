
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>
    <link rel="stylesheet" href="box-demo.css">
</head>
<body>
    <h1>CSS Box Model Demonstration</h1>

    <div class="box box-padding">
        <h2>Box 1: Padding</h2>
        <p>This box has 30px of padding.</p>
    </div>

    <div class="box box-border">
        <h2>Box 2: Border</h2>
        <p>This box has padding and a border.</p>
    </div>

    <div class="box box-margin">
        <h2>Box 3: Margin</h2>
        <p>This box has extra space below it.</p>
    </div>

    <div class="centered-card">
        <h2>Centered Card</h2>
        <p>This card is horizontally centred.</p>
    </div>
</body>
</html>
