
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="catalog.css">
</head>
<body>
    <h1>Product Catalog</h1>

    <h2>Categories</h2>
    <ul class="categories">
        <li>Electronics
            <ul>
                <li>Phones</li>
                <li>Laptops</li>
            </ul>
        </li>
        <li>Clothing
            <ul>
                <li>Shirts</li>
                <li>Trousers</li>
            </ul>
        </li>
    </ul>

    <h2>Products</h2>
    <table>
        <thead>
            <tr>
                <th>Product</th>
                <th>Quantity</th>
                <th>Price (KSh)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Phone</td>
                <td>2</td>
                <td>15,000</td>
            </tr>
            <tr>
                <td>Laptop</td>
                <td>1</td>
                <td>45,000</td>
            </tr>
            <tr>
                <td>Shirt</td>
                <td>3</td>
                <td>1,500</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="2">Total</td>
                <td>KSh 61,500</td>
            </tr>
        </tfoot>
    </table>
</body>
</html>
