<!DOCTYPE html>
<html>
<head>
    <title>Student Survey</title>
</head>
<body>

    <h1>Student Survey</h1>

    <form>

        <label for="name">Name:</label>
        <input type="text" id="name" name="name">

        <br><br>

        <p>How do you rate this course?</p>

        <input type="radio" id="excellent" name="rating" value="Excellent">
        <label for="excellent">Excellent</label>

        <br>

        <input type="radio" id="good" name="rating" value="Good">
        <label for="good">Good</label>

        <br>

        <input type="radio" id="fair" name="rating" value="Fair">
        <label for="fair">Fair</label>

        <br>

        <input type="radio" id="poor" name="rating" value="Poor">
        <label for="poor">Poor</label>

        <br><br>

        <p>Which topics are interesting to you?</p>

        <input type="checkbox" id="html" name="topic">
        <label for="html">HTML</label>

        <br>

        <input type="checkbox" id="css" name="topic">
        <label for="css">CSS</label>

        <br>

        <input type="checkbox" id="tables" name="topic">
        <label for="tables">Tables</label>

        <br>

        <input type="checkbox" id="forms" name="topic">
        <label for="forms">Forms</label>

        <br><br>

        <label for="comments">Comments:</label>

        <br>

        <textarea id="comments" name="comments"
                  rows="5" cols="40"></textarea>

        <br><br>

        <button type="submit">Submit Survey</button>

    </form>

</body>
</html>
