
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Font Stack Practice</title>
</head>
<body>

    <h1>CSS Font Stack Practice</h1>

    <p style="font-family: Arial, Helvetica, sans-serif;">
        Sans-serif: This text uses Arial or a similar font.
    </p>

    <p style="font-family: Georgia, 'Times New Roman', serif;">
        Serif: This text uses Georgia or a similar font.
    </p>

    <p style="font-family: 'Courier New', monospace;">
        Monospace: This text uses characters with equal spacing.
    </p>

</body>
</html>
